<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B132B" />
    <meta name="description" content="SwasthaSetu - Lightweight Telemedicine Prototype for Low-Bandwidth Coastal & Hill Talukas" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>SwasthaSetu - Low-Bandwidth Rural Telemedicine</title>
  </head>
  <body class="bg-[#0B132B] text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('SW registration skipped:', err.message);
          });
        });
      }
    </script>
  </body>
</html>
